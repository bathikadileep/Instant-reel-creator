name: Instant Reel Production CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend CI (Python 3.11, Lint, Migrations, Test Suites)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_test_password
          POSTGRES_DB: instant_reel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Validate Database Schema Migrations
        env:
          SYNC_DATABASE_URL: postgresql://postgres:postgres_ci_test_password@localhost:5432/instant_reel_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_test_password@localhost:5432/instant_reel_test
        run: |
          alembic upgrade head

      - name: Run Production Setup & Middlewares Verification
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_test_password@localhost:5432/instant_reel_test
          SYNC_DATABASE_URL: postgresql://postgres:postgres_ci_test_password@localhost:5432/instant_reel_test
          JWT_SECRET_KEY: ci_cd_test_secret_key_1234567890
          ENVIRONMENT: test
          DEBUG: "False"
        run: |
          python test_production_setup.py

  # ----------------------------------------------------------------------------
  # Job 2: Admin Panel CI (Node.js 20, TypeScript & Vite Static Build)
  # ----------------------------------------------------------------------------
  admin-ci:
    name: Admin Panel Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-panel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Production Site
        env:
          VITE_API_BASE_URL: https://instant-reel-api.onrender.com/api/v1
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          echo "Admin Panel production static bundle successfully built."

  # ----------------------------------------------------------------------------
  # Job 3: Docker Build Verification
  # ----------------------------------------------------------------------------
  docker-verification:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, admin-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: instant-reel-api:ci-test

      - name: Build Admin Panel Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-panel
          file: ./admin-panel/Dockerfile
          push: false
          tags: instant-reel-admin:ci-test

  # ----------------------------------------------------------------------------
  # Job 4: Automated Deploy to Render (Triggered on main branch push)
  # ----------------------------------------------------------------------------
  render-deploy:
    name: Trigger Render Production Deploy
    runs-on: ubuntu-latest
    needs: [docker-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy Backend to Render
        if: env.RENDER_API_DEPLOY_HOOK != ''
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          curl -X POST -s "$RENDER_API_DEPLOY_HOOK"
          echo "Render Backend deploy triggered successfully."

      - name: Deploy Admin Panel to Render
        if: env.RENDER_ADMIN_DEPLOY_HOOK != ''
        env:
          RENDER_ADMIN_DEPLOY_HOOK: ${{ secrets.RENDER_ADMIN_DEPLOY_HOOK }}
        run: |
          curl -X POST -s "$RENDER_ADMIN_DEPLOY_HOOK"
          echo "Render Admin Panel deploy triggered successfully."
