name: Build Android APK

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Android Setup
        run: flutter doctor -v

      - name: Get Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build Standalone Release APK
        working-directory: ./frontend
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output
          cp frontend/build/app/outputs/flutter-apk/app-release.apk output/instant-reel-v1.0.0.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-reel-apk
          path: output/instant-reel-v1.0.0.apk
          retention-days: 30
