version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instant_reel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/instant_reel
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/instant_reel
      - JWT_SECRET_KEY=local_dev_secret_key_change_in_production
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Optional local PostgreSQL database for offline development (Neon can be used directly instead)
  db:
    image: postgres:16-alpine
    container_name: instant_reel_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instant_reel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instant_reel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
