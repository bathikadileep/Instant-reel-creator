# ==============================================================================
# Render Infrastructure as Code Blueprint: Instant Reel Platform
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service: FastAPI + Docker
  # ----------------------------------------------------------------------------
  - type: web
    name: instant-reel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # or free
    region: oregon # or singapore to match your Neon DB latency
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: API_V1_STR
        value: /api/v1
      - key: PORT
        value: "8000"

      # Neon Serverless PostgreSQL Connection Strings
      # Format: postgresql+asyncpg://<user>:<password>@<neon-host>/neondb?ssl=require
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false

      # Authentication & Security
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SECURITY_HEADERS_ENABLED
        value: "True"

      # Allowed CORS Domains (Add your custom domains here)
      - key: CORS_ORIGINS
        value: "https://instant-reel-admin.onrender.com,http://localhost:3000,*"

      # Logging & Observability
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: PROMETHEUS_METRICS_ENABLED
        value: "True"

      # Sentry Error Tracking & APM (Optional)
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"

      # Razorpay Payment Gateway (Phase 8)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Firebase Cloud Messaging (Phase 10)
      - key: FCM_ENABLED
        value: "True"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Admin Panel: React Vite Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: instant-reel-admin
    rootDir: admin-panel
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true

    # SPA Client Routing: Rewrites all paths to index.html for React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Static Site Custom Headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      - key: VITE_API_BASE_URL
        value: https://instant-reel-api.onrender.com/api/v1
